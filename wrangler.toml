name = "phone-notify"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 静态页面目录（index.html / app.js / style.css）
[assets]
directory = "./public"
binding = "ASSETS"

# KV 命名空间：持久化配置 / 去重 / 限流计数 / 健康快照。
# 配了才会持久化（*.workers.dev 上 Cache API 不生效，没绑 KV 时配置只能放内存、重启就丢）。
[[kv_namespaces]]
binding = "NOTIFY_KV"
id = "8e6e7c1d2b2b47cba49e1911275903d2"

[vars]
# 非敏感默认值可以写这里；密钥请用：wrangler secret put SPUG_APP_KEY
SPUG_BASE_URL = "https://push.spug.cc"
SPUG_CHANNEL = "voice"
